name: CI

on:
  push:
  pull_request:

jobs:
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python runners/validate_cases.py --full
      - run: python -m unittest discover -s tests -p 'test_*.py'
