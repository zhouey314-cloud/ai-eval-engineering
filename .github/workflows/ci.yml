name: CI

on:
  push:
  pull_request:

jobs:
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python runners/validate_cases.py --full
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: python runners/evaluate.py --cases evals/golden_set.example.jsonl evals/regression_set.example.jsonl evals/high_risk_set.example.jsonl --responses examples/recorded-responses.jsonl --output output/contracts.json
